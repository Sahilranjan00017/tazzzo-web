name: deploy-uat-web

# Promotes a commit of branch `uat` to the two UAT Amplify apps (storefront, admin) AFTER the complete web CI has passed on
# that exact commit. Amplify's own auto-build for branch `uat` MUST be disabled (docs/uat/AMPLIFY_UAT_SETUP.md), otherwise
# a push would deploy before this gate. AWS access is OIDC only (aws-actions/configure-aws-credentials, one exchange per job,
# 1 hour session): no AWS key exists in GitHub secrets or variables.
#
# Needs (repository or environment `uat` VARIABLES, none of them secret):
#   AWS_UAT_WEB_DEPLOY_ROLE_ARN   IAM role trusted for this repo + environment uat (amplify:StartJob/GetJob only)
#   AWS_UAT_REGION                optional, default ap-south-1
#   AMPLIFY_UAT_STOREFRONT_APP_ID, AMPLIFY_UAT_ADMIN_APP_ID
#   UAT_STOREFRONT_URL, UAT_ADMIN_URL   e.g. https://uat.tazzzo.com, https://cms-uat.tazzzo.com
# NOT RUN: this workflow cannot run until the AWS side exists.

on:
  push:
    branches: [uat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-uat-web
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # First, so a dispatch from any other ref stops here and does not spend the full CI.
  guard:
    name: Only branch uat may deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          if [ "$GITHUB_REF" != 'refs/heads/uat' ]; then
            echo "::error::deploys run from refs/heads/uat only (this run is $GITHUB_REF)"
            exit 1
          fi

  # Exactly the pull-request CI: format, lint, typecheck, unit, integration, both Playwright suites, production build
  # (standalone + client-bundle secret-name checks) and the dependency audit.
  ci:
    name: CI gate
    needs: [guard]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy ${{ matrix.app }} to UAT
    needs: [guard, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: uat
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, admin]
    env:
      APP: ${{ matrix.app }}
      APP_ID: ${{ matrix.app == 'storefront' && vars.AMPLIFY_UAT_STOREFRONT_APP_ID || vars.AMPLIFY_UAT_ADMIN_APP_ID }}
      APP_URL: ${{ matrix.app == 'storefront' && vars.UAT_STOREFRONT_URL || vars.UAT_ADMIN_URL }}
      AWS_REGION: ${{ vars.AWS_UAT_REGION || 'ap-south-1' }}
    steps:
      - name: Required variables are set
        env:
          ROLE_ARN: ${{ vars.AWS_UAT_WEB_DEPLOY_ROLE_ARN }}
        run: |
          for name in APP_ID APP_URL ROLE_ARN; do
            if [ -z "${!name}" ]; then echo "::error::the repository/environment variable behind $name is not set"; exit 1; fi
          done

      # Fail early, before any AWS call: the branch must still point at the commit CI passed on (a later push to uat must
      # not be deployed under this run's gate).
      - name: Branch uat still points at the gated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/uat" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::refs/heads/uat is ${head} but this run gated ${GITHUB_SHA}; not deploying"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # One OIDC exchange for the whole job: the action exports masked credentials valid for the 1 hour session, so the many
      # get-job calls below never depend on the short-lived GitHub token. (Same action and pin as the backend UAT deploy.)
      - name: Configure AWS credentials (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_UAT_WEB_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - name: Start the Amplify release job
        id: start
        run: |
          job_id="$(aws amplify start-job \
            --app-id "$APP_ID" --branch-name uat \
            --job-type RELEASE --commit-id "$GITHUB_SHA" \
            --job-reason "github-actions run ${GITHUB_RUN_ID} after CI" \
            --query 'jobSummary.jobId' --output text)"
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"
          echo "started ${APP} job ${job_id}"

      - name: Wait for the Amplify job
        id: wait
        env:
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          deadline=$((SECONDS + 2700))
          while :; do
            status="$(aws amplify get-job --app-id "$APP_ID" --branch-name uat --job-id "$JOB_ID" --query 'job.summary.status' --output text)"
            echo "${APP} job ${JOB_ID}: ${status}"
            case "$status" in
              SUCCEED) break ;;
              FAILED|CANCELLED) echo "::error::Amplify job for ${APP} ended ${status}"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::timed out waiting for the Amplify job"; exit 1; fi
            sleep 20
          done
          built="$(aws amplify get-job --app-id "$APP_ID" --branch-name uat --job-id "$JOB_ID" --query 'job.summary.commitId' --output text)"
          # DETECT-ONLY: how StartJob treats --commit-id with RELEASE is unverified (it may build the branch head), so this
          # cannot prevent a wrong build, it only fails the run after the fact. The pre-start branch check above is the guard.
          if [ "$built" != "$GITHUB_SHA" ]; then
            echo "::error::Amplify built a different commit than the one CI passed on (expected ${GITHUB_SHA}, got ${built}); roll back"
            exit 1
          fi
          echo "built_sha=${built}" >> "$GITHUB_OUTPUT"

      - name: Smoke check ${{ matrix.app }}
        run: node scripts/amplify/smoke.mjs "$APP" "$APP_URL"

      - name: Record the deployed SHA
        if: always()
        env:
          JOB_ID: ${{ steps.start.outputs.job_id }}
          BUILT_SHA: ${{ steps.wait.outputs.built_sha }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### UAT web deploy: ${APP} (${OUTCOME})"
            echo
            echo "- Deployed commit: \`${BUILT_SHA:-not deployed}\`"
            echo "- Pipeline commit: \`${GITHUB_SHA}\`"
            echo "- Amplify job: \`${JOB_ID:-none}\`"
            echo "- URL: ${APP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
